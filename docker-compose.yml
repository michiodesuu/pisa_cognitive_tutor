version: "3.9"

# ════════════════════════════════════════════════════════
# PISA Cognitive Tutor - Docker Compose
# Starts: Qdrant, PostgreSQL (optional), Chatbot, API
# ════════════════════════════════════════════════════════

services:

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: pisa_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: pisa_chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - CONFIG_PATH=/app/configs/model_configs.yaml
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pisa_api
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - CONFIG_PATH=/app/configs/model_configs.yaml
    depends_on:
      - qdrant
      - chatbot

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pisa_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://dark-emus-shout.loca.lt
      - NEXT_PUBLIC_WS_URL=wss://dark-emus-shout.loca.lt
    depends_on:
      - api

volumes:
  qdrant_data: