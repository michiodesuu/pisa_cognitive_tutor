hardware:
  vram_gb: 24
  cuda_device: "cuda:0"
  cpu_threads: 8
  ocr_device: "cpu"
  vlm_device: "cuda:0"

vlm:
  model_id: "Qwen/Qwen3-VL-8B-Instruct"
  local_path: "./models/Qwen3-VL-8B-Instruct"
  load_in_4bit: true
  load_in_8bit: false
  torch_dtype: "bfloat16"
  max_new_tokens: 4096
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  do_sample: true
  attn_implementation: "sdpa"
  attn_fallback: "eager"
  min_pixels: 256
  max_pixels: 1280
  pdf_render_dpi: 200
  max_pages_per_shard: 3

embedding:
  model_id: "BAAI/bge-m3"
  local_path: "./models/bge-m3"
  device: "cpu"
  batch_size: 32
  max_length: 512
  dense_dim: 1024
  use_sparse: true
  use_dense: true
  use_colbert: false
  normalize_embeddings: true

chatbot_llm:
  backend: "ollama"
  ollama_base_url: "http://localhost:11434"
  model_name: "qwen3:8b"
  hf_model_id: "Qwen/Qwen3-8B"
  temperature: 0.7
  max_tokens: 1024
  top_p: 0.9
  stream: true

evaluator_ensemble:
  backend: "ollama"
  ollama_base_url: "http://localhost:11434"
  timeout_seconds: 600
  models:
    - name: "qwen3"
      tag: "qwen3:8b"
      weight: 1.0
    - name: "mistral"
      tag: "mistral:7b-instruct-v0.2-q8_0"
      weight: 1.0
    - name: "llama3"
      tag: "llama3.1:8b-instruct-q8_0"
      weight: 1.0
    - name: "typhoon"
      tag: "scb10x/llama3.1-typhoon2-8b-instruct:latest"
      weight: 1.0
  consensus_threshold: 0.75
  controversy_threshold: 0.50

qdrant:
  mode: "local"
  local_path: "./data/vector_db/qdrant"
  host: "localhost"
  port: 6333
  collection_name: "pisa_knowledge"
  dense_vector_name: "dense"
  dense_dim: 1024
  dense_distance: "Cosine"
  sparse_vector_name: "sparse"
  top_k: 8
  score_threshold: 0.55
  fusion_method: "rrf"

graph:
  storage_path: "./data/vector_db/knowledge_graph.gpickle"
  relation_types: [HAS_MISCONCEPTION, TESTS_COMPETENCY, RELATED_CONCEPT, PREREQUISITE_OF, APPEARS_IN_QUESTION]
  max_hops: 2
  max_subgraph_nodes: 20

session_db:
  path: "./data/chat_logs/sessions.db"
  duration_thresholds:
    passive_max: 8
    active_max: 25
    constructive_min: 25

knowledge_base:
  output_path: "./data/processed_jsonl/knowledge_base.jsonl"
  resume_from_checkpoint: true
  producer_queue_size: 4
  max_parallel_shards: 1

dspy:
  baseline_dataset_path: "./data/processed_jsonl/baseline_annotations.jsonl"
  optimized_prompts_path: "./configs/prompts/dspy_optimized/"
  strategy: "bootstrap"
  num_candidates: 10
  max_bootstrapped_demos: 3
  target_threshold: 0.70

# ── Ablation flags ────────────────────────────────────────────────────────────
# Each flag can be overridden per-session via POST /api/session/new { "ablation": {...} }
# Set a flag to false to disable that component — used for ablation study groups.
ablation:
  use_rag: true              # false = skip all retrieval; pure LLM baseline
  use_hybrid_search: true    # false = dense-only (no sparse/BM25 leg)
  use_knowledge_graph: true  # false = skip 2-hop graph subgraph enrichment
  use_sanitizer: true        # false = skip forbidden-word post-processing
  use_kappa_weighting: true  # false = equal model weights in ensemble voting

# ── Subject categories ────────────────────────────────────────────────────────
# Shown in the UI so students can filter questions by subject area.
# The `id` value is stored in the Qdrant payload as `subject_category`.
subject_categories:
  - id: "life_science"
    label: "Life Science"
    label_th: "ชีววิทยา"
    description: "Photosynthesis, ecosystems, genetics, cell biology, evolution"
  - id: "physical_science"
    label: "Physical Science"
    label_th: "วิทยาศาสตร์กายภาพ"
    description: "Energy transfer, forces, electromagnetic radiation, chemistry"
  - id: "earth_space"
    label: "Earth & Space Science"
    label_th: "โลกและอวกาศ"
    description: "Plate tectonics, climate systems, stellar evolution, geology"