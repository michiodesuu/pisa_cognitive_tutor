# ICAP Framework Cognitive Dimensions Scoring Rubric
# Used by the offline evaluator to score student responses C1-C8
# Score scale: 0=absent, 1=partial/surface, 2=full/deep, NA=not applicable

icap_hierarchy:
  I: Interactive    # highest
  C: Constructive
  A: Active
  P: Passive        # lowest

scoring_scale:
  0: "Absent or incorrect — no evidence of this dimension"
  1: "Partial — surface-level or incomplete engagement with this dimension"
  2: "Full — clear, correct, and deep engagement with this dimension"
  NA: "Not applicable — this dimension cannot be assessed from this response"

dimensions:
  C1:
    name: "Content Knowledge Accuracy"
    description: "Does the student correctly recall or state factual content related to the PISA question?"
    icap_level: "P-A"
    rubric:
      0: "States incorrect facts or shows no content knowledge"
      1: "States partially correct facts; some errors present"
      2: "All stated facts are correct and relevant"

  C2:
    name: "Concept Understanding Depth"
    description: "Does the student demonstrate understanding of the underlying scientific concept, not just surface recall?"
    icap_level: "A-C"
    rubric:
      0: "No conceptual understanding evident; rote recitation only"
      1: "Partial understanding; concept mentioned but not unpacked"
      2: "Clear, accurate explanation of the concept in own words"

  C3:
    name: "Data Interpretation & Quantitative Reasoning"
    description: "Can the student read, interpret, and reason from data, graphs, or tables in the PISA question?"
    icap_level: "A-C"
    rubric:
      0: "Ignores or misreads data; no quantitative engagement"
      1: "Reads simple values but misinterprets trends or relationships"
      2: "Correctly interprets data and draws valid quantitative conclusions"

  C4:
    name: "Causal / Mechanistic Reasoning"
    description: "Does the student explain WHY or HOW (cause-effect, mechanism), not just WHAT?"
    icap_level: "C"
    rubric:
      0: "No causal language; describes without explaining mechanism"
      1: "Causal link attempted but logically incomplete or partially wrong"
      2: "Correct and complete mechanistic explanation with clear causality"

  C5:
    name: "Evidence Evaluation & Scientific Argumentation"
    description: "Can the student evaluate evidence quality, distinguish observation from inference, or construct a claim-evidence-reasoning argument?"
    icap_level: "C"
    rubric:
      0: "No distinction between evidence and claim; accepts all stated facts"
      1: "Identifies some evidence but reasoning chain is incomplete"
      2: "Clear claim-evidence-reasoning structure; critically evaluates evidence"

  C6:
    name: "Model-Based / Analogical Thinking"
    description: "Does the student use models, analogies, or abstract representations to explain phenomena?"
    icap_level: "C-I"
    rubric:
      0: "No use of models or analogies"
      1: "Attempts a model or analogy but it is imprecise or partially wrong"
      2: "Correct and illuminating model or analogy that extends understanding"

  C7:
    name: "Systems Thinking & Transfer"
    description: "Can the student connect concepts across domains, recognize emergent behavior, or transfer knowledge to a novel context?"
    icap_level: "C-I"
    rubric:
      0: "Response is isolated; no cross-domain connection or transfer"
      1: "Attempts transfer but with significant gaps or errors"
      2: "Correctly connects concepts across domains or transfers to new context"

  C8:
    name: "Metacognitive Reflection"
    description: "Does the student reflect on their own reasoning process, acknowledge uncertainty, or identify what they still need to learn?"
    icap_level: "I"
    rubric:
      0: "No self-reflection; states answers with false certainty"
      1: "Some hedging language but no genuine reflection on reasoning"
      2: "Explicitly reflects on own thinking, uncertainty, or knowledge gaps"

# Dimension groupings by ICAP level for profiling
icap_dimension_map:
  Passive: []           # Passive behavior leaves no text to analyze
  Active: [C1, C2, C3]
  Constructive: [C4, C5, C6]
  Interactive: [C7, C8]

# Forbidden words in the Chatbot — if any appear, test fails
forbidden_chatbot_words:
  - "Correct"
  - "Incorrect"
  - "Wrong"
  - "Right answer"
  - "Well done"
  - "Good job"
  - "Try again"
  - "That is right"
  - "That is wrong"
  - "You got it"
  - "ถูกต้อง"      # Thai: correct
  - "ผิด"          # Thai: wrong
  - "เก่งมาก"      # Thai: very good

# ─── C1–C8 Neuro-Software Engineering Multi-Taxonomy ──────────────────────────
# Maps each ICAP cognitive dimension to its multi-disciplinary counterparts
# Reference: Computational Neuro-Software Engineering (2026)
neuro_taxonomy:
  C1:
    cognitive_capacity: "Sustained Attention"
    neuro_structural_ale: "Anterior/Middle/Posterior Cingulate (58.3% of largest cluster)"
    somatosensory_cervical: "Head & neck movement; supraspinal cardiac control"
    clinical_criteria: "Price per test for patient"
    psydefconv_defense_level: 1
    defense_label: "High Adaptive Defenses (e.g., humor, anticipation)"
    activity_reserve: "Youth/adulthood reading and writing activities"

  C2:
    cognitive_capacity: "Response Inhibition"
    neuro_structural_ale: "Medial Frontal Gyrus (39.3% of cluster)"
    somatosensory_cervical: "Upper shoulders & diaphragm control (breathing)"
    clinical_criteria: "Portability of testing device"
    psydefconv_defense_level: 2
    defense_label: "Mental Inhibition Defenses (e.g., displacement)"
    activity_reserve: "Computational and strategic gaming activities"

  C3:
    cognitive_capacity: "Speed of Information Processing"
    neuro_structural_ale: "Superior Frontal Gyrus (21.7% of largest cluster)"
    somatosensory_cervical: "Deltoid & biceps control (upper arms)"
    clinical_criteria: "Level of skill needed for administration"
    psydefconv_defense_level: 3
    defense_label: "Minor Image Distortion (e.g., devaluation)"
    activity_reserve: "Professional and technical continuing education"

  C4:
    cognitive_capacity: "Cognitive Flexibility"
    neuro_structural_ale: "Cingulate Gyrus medial cluster (40.0% of cluster)"
    somatosensory_cervical: "Wrist extension & partial biceps control"
    clinical_criteria: "Time required for assessment"
    psydefconv_defense_level: 4
    defense_label: "Disavowal Defenses (e.g., denial, rationalization)"
    activity_reserve: "Linguistic translation and multi-lingual tasks"

  C5:
    cognitive_capacity: "Multiple Simultaneous Attention"
    neuro_structural_ale: "Frontoparietal attentional networks"
    somatosensory_cervical: "Triceps & wrist extension control"
    clinical_criteria: "Area Under the Curve (AUC) statistical power"
    psydefconv_defense_level: 5
    defense_label: "Major Image Distortion (e.g., splitting)"
    activity_reserve: "Complex visual-spatial arts and crafting"

  C6:
    cognitive_capacity: "Working Memory"
    neuro_structural_ale: "Prefrontal-parietal retrieval loops"
    somatosensory_cervical: "Hand & finger flexion (grip strength)"
    clinical_criteria: "Diagnostic accuracy coefficient"
    psydefconv_defense_level: 6
    defense_label: "Action-oriented Defenses (e.g., acting out)"
    activity_reserve: "Memory-intensive board games and chess"

  C7:
    cognitive_capacity: "Category Formation"
    neuro_structural_ale: "Cingulate Gyrus medial cluster (25.0% of cluster)"
    somatosensory_cervical: "Upper limb neuro-sensory feedback integration"
    clinical_criteria: "Usage feasibility in clinical setups"
    psydefconv_defense_level: 7
    defense_label: "Borderline Defensive Level (e.g., projection)"
    activity_reserve: "Logical categorization and archiving tasks"

  C8:
    cognitive_capacity: "Pattern Recognition & Inductive Thinking"
    neuro_structural_ale: "Cerebellar-cortical loop networks"
    somatosensory_cervical: "Cardiorespiratory autonomic sympathetic outflow"
    clinical_criteria: "Correlative link with overall brain health"
    psydefconv_defense_level: 8
    defense_label: "Psychotic / Delusional defenses"
    activity_reserve: "Multi-step scientific and mathematical inquiry"

# ─── Research Metrics ──────────────────────────────────────────────────────────
# The four novel metrics from Computational Neuro-Software Engineering framework
research_metrics:
  LCAI:
    full_name: "Lifespan Cognitive Adaptability Index"
    formula: "LCAI = (theta_a * log10(KEDE)) / (tau * sum_ICP)"
    research_topic: 1
    dimensions: [C4, C6]

  CASM:
    full_name: "Cervical Autonomic Strain Metric"
    formula: "CASM = (LF/HF / RMSSD) * (1 + delta_EMG) * ln(ICP_active)"
    research_topic: 2
    dimensions: [C1, C2, C3]

  MCI:
    full_name: "Metacognitive Coping Index"
    formula: "MCI = sum(w_adaptive * Phi_adaptive) / (sum(w_defensive * Phi_defensive) + Psi_perplexity)"
    research_topic: 3
    dimensions: [C6, C7, C8]

  PCRS:
    full_name: "Proteomic Cognitive Resilience Score"
    formula: "PCRS = (ln(C1_inhibitor) / ln(sTie1)) * (KEDE_obs / KEDE_base) * (1 / CASM)"
    research_topic: 4
    dimensions: [C3, C7]
